<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Play Tetris online - Free classic puzzle game.">
  <meta name="theme-color" content="#1a1a2e">
  <title>Play Tetris - Tetris Online</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-page">
  <!-- Header -->
  <header class="game-header">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="game-title">🎮 TETRIS</div>
  </header>

  <!-- Game Container -->
  <main class="game-container">
    <!-- Left Panel (Desktop) -->
    <aside class="side-panel left-panel">
      <div class="info-box score-box">
        <div class="info-label">SCORE</div>
        <div class="info-value" id="score-value">0</div>
      </div>
      <div class="info-box">
        <div class="info-label">LEVEL</div>
        <div class="info-value" id="level-value">1</div>
      </div>
      <div class="info-box">
        <div class="info-label">LINES</div>
        <div class="info-value" id="lines-value">0</div>
      </div>
    </aside>

    <!-- Center: Game Board -->
    <div class="game-board">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- Right Panel (Desktop) -->
    <aside class="side-panel right-panel">
      <div class="next-box">
        <div class="next-label">NEXT</div>
        <canvas id="next-canvas"></canvas>
      </div>
      <div class="controls-box">
        <button class="ctrl-btn" id="btn-rotate">↻</button>
        <div class="ctrl-row">
          <button class="ctrl-btn" id="btn-left">◀</button>
          <button class="ctrl-btn" id="btn-down">▼</button>
          <button class="ctrl-btn" id="btn-right">▶</button>
        </div>
        <button class="ctrl-btn" id="btn-drop">⏬</button>
      </div>
      <button class="action-btn start-btn" id="start-btn">START</button>
      <button class="action-btn pause-btn" id="pause-btn">PAUSE</button>
    </aside>
  </main>

  <!-- Mobile Controls -->
  <footer class="mobile-controls">
    <div class="mobile-info-row">
      <div class="m-info"><span>SCORE</span><span id="m-score">0</span></div>
      <div class="m-info"><span>LV</span><span id="m-level">1</span></div>
      <div class="m-info"><span>NEXT</span><canvas id="m-next-canvas"></canvas></div>
    </div>
    <div class="mobile-btn-row">
      <button class="m-btn" id="m-rotate">↻</button>
      <button class="m-btn" id="m-left">◀</button>
      <button class="m-btn" id="m-down">▼</button>
      <button class="m-btn" id="m-right">▶</button>
      <button class="m-btn" id="m-drop">⏬</button>
    </div>
    <button class="m-start-btn" id="m-start-btn">START GAME</button>
  </footer>

  <!-- Game Over Overlay -->
  <div class="game-overlay" id="game-overlay">
    <div class="overlay-box">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score">
        <span>SCORE</span>
        <span id="final-score">0</span>
      </div>
      <button class="overlay-btn" id="restart-btn">PLAY AGAIN</button>
      <button class="overlay-btn secondary" id="home-btn">HOME</button>
    </div>
  </div>

  <script src="js/tetris.js"></script>
</body>
</html>
